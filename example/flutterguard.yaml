version: 1

discovery:
  mode: auto
  roots: []
  maxDepth: 4

include:
  - "**/*.dart"
  - "**/*.yaml"
  - "**/*.xml"
  - "**/*.plist"
  - "**/*.gradle"
  - "**/*.arb"
  - "**/*.png"
  - "**/*.svg"

exclude:
  - "**/.dart_tool/**"
  - "**/build/**"
  - "**/.git/**"

modules:
  branding: true
  configuration: true
  architecture: true
  codeQuality: true
  security: true
  localization: true
  dependencies: true
  platform: true

architecture:
  profile: none
  featureCoupling: true
  businessLogicComplexity: 12

codeQuality:
  complexityThreshold: 15
  classLineThreshold: 300
  methodLineThreshold: 80

severity:
  minReport: info
  overrides: {}

suppressions: []

baseline:
  enabled: false
  path: .flutterguard-baseline.json
  failOnNew: true

reports:
  directory: build/flutterguard
  formats:
    - html
    - json
    - markdown
    - sarif
  history: false
  openHtml: false

qualityGate:
  failOn:
    - high
    - critical

network:
  outdatedChecks: false
  vulnerabilityChecks: false

localization:
  requiredLocales: []

customRules: []
rules: {}
