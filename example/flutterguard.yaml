# Canonical FlutterGuard configuration.
# Copy this file to the root of a Flutter application as .flutterguard.yaml.
# When that file is absent, FlutterGuard uses built-in defaults and does not
# fail the scan. Unknown keys are errors. This sample matches `flutterguard init`.
version: 1

discovery:
  # auto walks the tree and also reads melos.yaml and a pub workspace.
  # single reads only the directory you scanned.
  # monorepo fails if that walk finds no Flutter project.
  mode: auto
  roots: []
  maxDepth: 4

include:
  - "**/*.dart"
  - "**/*.yaml"
  - "**/*.yml"
  - "**/pubspec.lock"
  - "**/*.xml"
  - "**/*.plist"
  - "**/*.gradle"
  - "**/*.kts"
  - "**/*.arb"
  - "**/*.html"
  - "**/*.json"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.webp"
  - "**/*.svg"
  - "**/*.xcconfig"
  - "**/*.pbxproj"
  - "**/CMakeLists.txt"
  - "**/.env"

exclude:
  - "**/.dart_tool/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/ios/Pods/**"
  - "**/android/.gradle/**"
  - "**/.symlinks/**"
  - "**/ephemeral/**"

modules:
  branding: true
  configuration: true
  architecture: true
  codeQuality: true
  security: true
  localization: true
  dependencies: true
  platform: true

architecture:
  # none, clean, featureFirst, or custom.
  # none does not assume Clean Architecture, BLoC, Riverpod, or Provider.
  profile: none
  featureCoupling: true
  businessLogicComplexity: 12

codeQuality:
  complexityThreshold: 15
  classLineThreshold: 300
  methodLineThreshold: 80

allowedHosts:
  - localhost
  - 127.0.0.1
  - 10.0.2.2
  - example.com

severity:
  minReport: info
  overrides: {}

suppressions: []

baseline:
  enabled: false
  path: .flutterguard-baseline.json
  failOnNew: true

reports:
  directory: build/flutterguard
  formats:
    - html
    - json
    - markdown
    - sarif
  history: false
  openHtml: false

qualityGate:
  failOn:
    - high
    - critical
  maxFindings: null
  maxNewFindings: null

network:
  outdatedChecks: false
  vulnerabilityChecks: false

localization:
  requiredLocales: []

customRules: []
rules: {}
