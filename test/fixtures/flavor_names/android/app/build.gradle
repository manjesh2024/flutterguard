android {
    defaultConfig {
        applicationId "com.flavor.shared"
        minSdk 24
    }
    productFlavors {
        dev {
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Flavor Dev"
        }
        prod {
            applicationIdSuffix ".prod"
            resValue "string", "app_name", "Flavor Prod"
        }
    }
}
