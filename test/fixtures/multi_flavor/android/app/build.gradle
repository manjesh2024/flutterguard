android {
    defaultConfig {
        applicationId "com.multi.app"
        minSdk 24
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
        }
    }
    productFlavors {
        dev {
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Multi Dev"
        }
        prod {
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Multi Prod"
        }
    }
}
