name: flutterguard_audit
description: >-
  Audit Flutter projects for branding, configuration, architecture,
  code quality, security, localization, dependencies, and platform setup.
version: 0.2.0
homepage: https://github.com/manjesh2024/flutterguard
repository: https://github.com/manjesh2024/flutterguard
issue_tracker: https://github.com/manjesh2024/flutterguard/issues
documentation: https://github.com/manjesh2024/flutterguard/tree/main/docs
topics:
  - flutter
  - analyzer
  - security
  - lints
  - cli

environment:
  sdk: ^3.13.0

executables:
  flutterguard: flutterguard

dependencies:
  analyzer: ^14.7.0
  args: ^2.7.0
  crypto: ^3.0.8
  path: ^1.9.1
  xml: ^7.1.0
  yaml: ^3.1.4

dev_dependencies:
  coverage: ^1.16.0
  lints: ^6.1.0
  test: ^1.33.0
